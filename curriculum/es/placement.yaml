# Placement test es-ES (roadmap C.2). Shape and validation: core/placement.py.
# GENERIC entry test for every learner (docs/feedback/2026-11-21): items are written from level
# descriptors — PCIC inventories (Gramática, Funciones, Nociones) and CEFR CV 2020 can-do —
# never from one learner's situations (those belong to personal diagnostics: error log 1.6,
# mastery C.4, SRS 3.1). Neutral everyday contexts, Spanish-only options (valid for any L1);
# `topic_ru` / `hint_ru` are UI labels only and are never needed to answer.
# `source` = the descriptor the item tests (PCIC cited by inventory + band + item name; section
# numbers only where verified, see curriculum/es/SOURCES.md). `grammar` links an item to a grammar
# point of units/*.yaml (gaps → starting unit), `category` to the 1.3 error categories.
# Levels are PROVISIONAL until calibrated on answers of many learners (5.4/5.5).
language: es
variant: es-ES
calibration: provisional
items:
  # --- A1 -----------------------------------------------------------------
  - {id: a1-ser-presentarse, level: A1, category: ser_estar, topic_ru: "ser: кто я, откуда",
     source: "PCIC A1 Gramática: ser (identificación, origen); Funciones: presentarse",
     stem: "Hola, ___ Marta y soy de Chile.", options: ["estoy", "soy", "es", "tengo"], answer: "soy"}
  - {id: a1-articulo-genero, level: A1, category: gender, topic_ru: "род и артикль (un / una)",
     source: "PCIC A1 Gramática: artículo indeterminado, concordancia de género",
     stem: "Vivo en ___ ciudad pequeña.", options: ["un", "una", "uno", "unos"], answer: "una"}
  - {id: a1-presente-nosotros, level: A1, category: agreement, topic_ru: "настоящее время: окончания",
     source: "PCIC A1 Gramática: presente de indicativo, verbos regulares",
     stem: "Nosotros ___ en la universidad.", options: ["estudian", "estudio", "estudiamos", "estudias"],
     answer: "estudiamos"}
  - {id: a1-gustar, level: A1, category: agreement, topic_ru: "gustar: me gusta / me gustan",
     source: "PCIC A1 Gramática: gustar + SN plural; Funciones: expresar gustos",
     stem: "A mí me ___ mucho los deportes.", options: ["gusta", "gustan", "gusto", "gustas"], answer: "gustan"}
  - {id: a1-estar-lugar, level: A1, category: ser_estar, topic_ru: "estar: где что находится",
     source: "PCIC A1 Gramática: estar (localización); Funciones: preguntar por la ubicación",
     stem: "Perdona, ¿dónde ___ la estación de autobuses?", options: ["es", "hay", "está", "tiene"],
     answer: "está"}
  - {id: a1-cuanto-cuesta, level: A1, category: lexical, topic_ru: "базовые вопросы: цена", kind: meaning,
     source: "PCIC A1 Funciones: preguntar por el precio; CEFR CV 2020 Obtaining goods and services A1",
     stem: "En una tienda quieres saber el precio de una camiseta. ¿Qué preguntas?",
     options: ["¿Cuánto cuesta?", "¿Cuántos años tiene?", "¿Dónde está?", "¿Qué hora es?"],
     answer: "¿Cuánto cuesta?"}
  - {id: a1-ir-al, level: A1, category: preposition, topic_ru: "ir a / al (направление)",
     source: "PCIC A1 Gramática: preposición a con verbos de movimiento, contracción al",
     stem: "Todos los días voy ___ trabajo en metro.", options: ["en", "al", "de", "por"], answer: "al"}

  # --- A2 -----------------------------------------------------------------
  - {id: a2-perfecto-todavia, level: A2, category: tense_aspect, grammar: perfecto_hoy,
     topic_ru: "pretérito perfecto: сегодня / ещё не", hint_ru: "в Испании",
     source: "PCIC A2 Gramática: pretérito perfecto con todavía no / hoy (variedad centro-norte peninsular)",
     stem: "Son las tres y todavía no ___ nada.", options: ["comía", "he comido", "comeré", "comido"],
     answer: "he comido"}
  - {id: a2-se-le-roto, level: A2, category: agreement, grammar: se_me_accidental,
     topic_ru: "se le ha roto (случайность, не нарочно)",
     source: "PCIC A2 Gramática: construcción se + pronombre de OI + verbo (acciones involuntarias)",
     stem: "A Pedro se le ___ el móvil esta mañana.", options: ["he roto", "ha roto", "han roto", "rompe"],
     answer: "ha roto"}
  - {id: a2-indefinido-vino, level: A2, category: tense_aspect, grammar: indefinido_ayer,
     topic_ru: "pretérito indefinido: неправильные глаголы",
     source: "PCIC A2 Gramática: pretérito indefinido, verbos irregulares frecuentes",
     stem: "Ayer mi hermano ___ a cenar a casa.", options: ["venía", "vino", "ha venido", "vine"],
     answer: "vino"}
  - {id: a2-traer-llevar, level: A2, category: lexical, grammar: dejar_traer_llevar,
     topic_ru: "traer / llevar / dejar", hint_ru: "говорит хозяин дома",
     source: "PCIC A2 Nociones: verbos de movimiento con perspectiva (traer / llevar)",
     stem: "Mañana cenamos en mi casa. ¿Puedes ___ el postre?", options: ["llevar", "traer", "dejar", "dar"],
     answer: "traer"}
  - {id: a2-que-te-pongo, level: A2, category: lexical, grammar: poner_pedir,
     topic_ru: "в баре: poner = подать",
     source: "PCIC A2 Funciones: pedir en un bar o restaurante; CEFR CV 2020 Obtaining goods and services A2",
     stem: "En un bar, el camarero te pregunta: «Hola, ¿qué te ___?»", options: ["pido", "pongo", "compro", "tomo"],
     answer: "pongo"}
  - {id: a2-usted-desconocido, level: A2, category: register, grammar: tu_usted_servicio,
     topic_ru: "tú / usted с незнакомыми", hint_ru: "пожилому мужчине на улице",
     source: "PCIC A2 Funciones: llamar la atención (usted); Tácticas: tratamiento formal",
     stem: "___, ¿sabe usted dónde hay una farmacia?",
     options: ["Disculpa", "Disculpe", "Disculpad", "Disculpas"], answer: "Disculpe"}
  - {id: a2-genero-problema, level: A2, category: gender, grammar: genero_no_o_a,
     topic_ru: "род слов не на -o/-a (el problema, la canción)",
     source: "PCIC A2 Gramática: género de sustantivos en -ma, -ción, -dad",
     stem: "No te preocupes, ___ problema es pequeño.", options: ["la", "el", "lo", "las"], answer: "el"}
  - {id: a2-quitar-aparato, level: A2, category: lexical, grammar: poner_quitar,
     topic_ru: "poner / quitar (включить / выключить)",
     source: "PCIC A2 Nociones: aparatos de la casa (poner / quitar / encender / apagar, uso peninsular)",
     stem: "Ya hace frío aquí. ¿___ el aire acondicionado, por favor?",
     options: ["Sacas", "Quitas", "Cierras", "Tiras"], answer: "Quitas"}
  - {id: a2-lo-tengo, level: A2, category: clitic, topic_ru: "местоимения lo / la (прямое дополнение)",
     source: "PCIC A2 Gramática: pronombres de objeto directo átonos",
     stem: "—¿Tienes el billete? —Sí, ya ___ tengo.", options: ["le", "lo", "la", "se"], answer: "lo"}

  # --- B1 -----------------------------------------------------------------
  - {id: b1-que-tengas, level: B1, category: mood, grammar: que_subjuntivo_deseo,
     topic_ru: "пожелания: que + subjuntivo",
     source: "PCIC B1 Gramática: que + presente de subjuntivo (deseos); Funciones: expresar buenos deseos",
     stem: "¡Adiós! ¡Que ___ buen viaje!", options: ["tienes", "tendrás", "tengas", "tener"], answer: "tengas"}
  - {id: b1-espero-que, level: B1, category: mood, grammar: esperar_que,
     topic_ru: "espero que + subjuntivo",
     source: "PCIC B1 Gramática: esperar que + subjuntivo (sujetos distintos)",
     stem: "Espero que te ___ el regalo.", options: ["gusta", "guste", "gustará", "gustar"], answer: "guste"}
  - {id: b1-espero-infinitivo, level: B1, category: mood, grammar: esperar_que,
     topic_ru: "espero + инфинитив (тот же субъект)",
     source: "PCIC B1 Gramática: esperar + infinitivo (mismo sujeto)",
     stem: "Ahorro dinero porque espero ___ un coche este año.",
     options: ["que compro", "comprar", "comprando", "de comprar"], answer: "comprar"}
  - {id: b1-mientras-imperfecto, level: B1, category: tense_aspect, topic_ru: "imperfecto vs indefinido (фон и событие)",
     source: "PCIC B1 Gramática: contraste imperfecto / indefinido (acción en desarrollo interrumpida)",
     stem: "Mientras ___ la cena, sonó el teléfono.", options: ["preparé", "he preparado", "preparaba", "prepararé"],
     answer: "preparaba"}
  - {id: b1-ser-evento, level: B1, category: ser_estar, topic_ru: "ser для событий (где проходит)",
     source: "PCIC B1 Gramática: ser para localizar eventos",
     stem: "La fiesta ___ en casa de Ana, en el centro.", options: ["está", "es", "hay", "tiene"], answer: "es"}
  - {id: b1-se-lo, level: B1, category: clitic, topic_ru: "два местоимения: se lo",
     source: "PCIC B1 Gramática: combinación de pronombres OI + OD (se lo)",
     stem: "—¿Le has dado el libro a Ana? —Sí, ya ___ he dado.", options: ["le lo", "se lo", "lo le", "se le"],
     answer: "se lo"}
  - {id: b1-gracias-por, level: B1, category: preposition, topic_ru: "por / para",
     source: "PCIC B1 Gramática: por (causa) / para (finalidad); Funciones: agradecer",
     stem: "Muchas gracias ___ tu ayuda.", options: ["para", "de", "por", "a"], answer: "por"}
  - {id: b1-es-importante-que, level: B1, category: mood, topic_ru: "es importante que + subjuntivo",
     source: "PCIC B1 Gramática: expresiones de valoración + que + subjuntivo",
     stem: "Es importante que todos ___ a tiempo a la reunión.",
     options: ["llegan", "lleguen", "llegarán", "llegar"], answer: "lleguen"}

  # --- B2 -----------------------------------------------------------------
  - {id: b2-me-alegre-vinieran, level: B2, category: mood, topic_ru: "imperfecto de subjuntivo после чувства",
     source: "PCIC B2 Gramática: imperfecto de subjuntivo tras verbos de sentimiento en pasado",
     stem: "Me alegré mucho de que mis padres ___ a verme.",
     options: ["vienen", "vengan", "vinieran", "vendrían"], answer: "vinieran"}
  - {id: b2-si-tuviera, level: B2, category: mood, topic_ru: "si + imperfecto de subjuntivo",
     source: "PCIC B2 Gramática: oraciones condicionales irreales (si + imperfecto de subjuntivo)",
     stem: "Si ___ más tiempo, aprendería a tocar la guitarra.",
     options: ["tuviera", "tendría", "tenga", "tengo"], answer: "tuviera"}
  - {id: b2-busco-piso-que, level: B2, category: mood, topic_ru: "subjuntivo в относительных (любой, какой-нибудь)",
     hint_ru: "любую квартиру, лишь бы с террасой",
     source: "PCIC B2 Gramática: subjuntivo en oraciones de relativo con antecedente no específico",
     stem: "Busco un piso que ___ terraza.", options: ["tiene", "tenga", "tendrá", "tener"], answer: "tenga"}
  - {id: b2-cuando-llegue, level: B2, category: mood, topic_ru: "cuando + subjuntivo (будущее)",
     source: "PCIC B2 Gramática: cuando + subjuntivo con valor de futuro",
     stem: "Te llamo cuando ___ a casa.", options: ["llego", "llegaré", "llegue", "llegara"], answer: "llegue"}
  - {id: b2-habia-salido, level: B2, category: tense_aspect, topic_ru: "pluscuamperfecto (уже ушёл раньше)",
     source: "PCIC B2 Gramática: pretérito pluscuamperfecto (anterioridad a un pasado)",
     stem: "Cuando llegué a la estación, el tren ya ___.", options: ["salió", "había salido", "ha salido", "salía"],
     answer: "había salido"}
  - {id: b2-por-lo-tanto, level: B2, category: lexical, topic_ru: "связки: причина → следствие",
     source: "PCIC B2 Tácticas y estrategias: marcadores consecutivos; CEFR CV 2020 Coherence and cohesion B2",
     stem: "Ha llovido toda la semana; ___, el concierto al aire libre se ha cancelado.",
     options: ["sin embargo", "por lo tanto", "en cambio", "a pesar de"], answer: "por lo tanto"}
  - {id: b2-tomar-decision, level: B2, category: lexical, topic_ru: "устойчивые сочетания (tomar una decisión)",
     source: "PCIC B2 Nociones: colocaciones verbo + sustantivo (tomar una decisión)",
     stem: "Tenemos que ___ una decisión antes del viernes.", options: ["hacer", "tomar", "dar", "poner"],
     answer: "tomar"}

# Production prompts: free answers, stored for the tutor (scored later with an LLM / in C.4,
# sla §6: measure free production, not only quizzes). Shown for the placed level and the next one.
production:
  - {id: p-a1-presentate, level: A1, prompt_ru: "Расскажи о себе в 2–3 предложениях: кто ты, где живёшь, что любишь.",
     prompt_es: "Preséntate: ¿quién eres, dónde vives, qué te gusta?", targets: [ser_estar, agreement]}
  - {id: p-a2-hoy, level: A2, prompt_ru: "Что ты сделал сегодня? 2–3 предложения.",
     prompt_es: "¿Qué has hecho hoy?", targets: [perfecto_hoy]}
  - {id: p-b1-deseos, level: B1, prompt_ru: "У друга завтра собеседование. Пожелай ему удачи и скажи, на что надеешься.",
     prompt_es: "Tu amigo tiene una entrevista mañana. Deséale suerte.", targets: [que_subjuntivo_deseo, esperar_que]}
  - {id: p-b2-opinion, level: B2, prompt_ru: "Стоит ли жить в маленьком городе, а не в столице? Аргументируй (aunque, si…).",
     prompt_es: "¿Es mejor vivir en una ciudad pequeña que en una capital? ¿Por qué?", targets: [mood]}
